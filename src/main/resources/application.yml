spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/nexosalud}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  application:
    name: gateway-service
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  webflux:
    # base-path removido — el gateway maneja el prefijo /api/v1 en los controllers
    # CORS gestionado por WebCorsConfiguration.java (lee CORS_ALLOWED_ORIGINS env var)

logging:
  level:
    org.springframework.data.r2dbc: Debug

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation1234567890}
  expiration: ${JWT_EXPIRATION:3600000}

auth:
  mock-mode: ${AUTH_MOCK_MODE:true}

server:
  port: ${SERVER_PORT:8080}

---
spring:
  config:
    activate:
      on-profile: test
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/nexosalud
    username: postgres
    password: postgres
  application:
    name: gateway-service

jwt:
  secret: test-secret-key-for-testing-purposes-only-12345678
  expiration: 3600000

auth:
  mock-mode: true

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/nexosalud}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  application:
    name: gateway-service
  logging:
    level:
      org.springframework.data.r2dbc: Debug

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation1234567890}
  expiration: ${JWT_EXPIRATION:3600000}

auth:
  mock-mode: ${AUTH_MOCK_MODE:false}

server:
  port: ${SERVER_PORT:8080}
